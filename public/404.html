<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>길을 잃었어요 · Crypt Survivors</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100%;
        padding: 16px;
        background: #0d0a14 url('/title/key-art.webp') 62% 50% / cover no-repeat;
        color: #e8e0f4;
        font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      }
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background:
          linear-gradient(180deg, rgba(9, 7, 16, 0.72), rgba(9, 7, 16, 0.86)),
          radial-gradient(ellipse at 50% 50%, transparent 30%, rgba(5, 4, 10, 0.7) 100%);
      }
      main {
        position: relative;
        width: 100%;
        max-width: 460px;
        padding: 32px 28px 30px;
        text-align: center;
        background: rgba(12, 10, 20, 0.88);
        border: 3px solid #000;
        box-shadow: 0 0 0 2px #3d3050, 8px 8px 0 rgba(0, 0, 0, 0.5), 0 0 28px rgba(240, 210, 122, 0.18);
      }
      .code {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 64px;
        line-height: 1;
        letter-spacing: 6px;
        color: #f0c14b;
        text-shadow: 3px 3px 0 #000, 0 0 18px rgba(240, 210, 122, 0.4);
      }
      h1 { margin: 14px 0 8px; font-size: 22px; letter-spacing: 1px; }
      p { font-size: 15px; line-height: 1.6; color: #cfc8e0; }
      a {
        display: inline-block;
        margin-top: 22px;
        min-height: 44px;
        padding: 12px 28px;
        font-size: 16px;
        font-weight: 700;
        color: #f0c14b;
        text-decoration: none;
        background: #2a2440;
        border: 3px solid #000;
        box-shadow: 4px 4px 0 #0d0a14;
      }
      a:hover, a:focus-visible { background: #3a3158; outline: 2px solid #f0c14b; outline-offset: 2px; }
      .brand { margin-top: 18px; font-size: 12px; letter-spacing: 4px; color: #b8aed0; }
    </style>
  </head>
  <body>
    <main>
      <div class="code" aria-hidden="true">404</div>
      <h1>길을 잃었어요</h1>
      <p>이 통로는 막혀 있어요.<br />처음 화면에서 다시 모험을 떠나요.</p>
      <a href="/">처음 화면으로</a>
      <div class="brand">CRYPT SURVIVORS</div>
    </main>
  </body>
</html>
