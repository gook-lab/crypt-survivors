<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Heroes XHD · Crypt Asset Pack</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../showcase.css" />
<style>
  .x-row {
    background: linear-gradient(180deg, var(--panel), var(--bg-2));
    border: 1px solid var(--line);
    padding: 22px 26px;
    margin-bottom: 18px;
    display: grid;
    grid-template-columns: 200px repeat(3, 1fr);
    gap: 18px;
    align-items: center;
    position: relative; overflow: hidden;
  }
  .x-row::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 100% 0%, var(--accent), transparent 60%);
    opacity: 0.18; pointer-events: none;
  }
  .x-row .info { position: relative; z-index: 1; }
  .x-row .info h3 {
    font-family: 'Cinzel', serif;
    color: var(--ink);
    font-size: 22px;
    letter-spacing: 0.06em;
    margin: 0 0 4px;
  }
  .x-row .info .role {
    color: var(--gold-hi);
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .x-row .info .desc {
    color: var(--ink-dim);
    font-size: 11px;
    line-height: 1.55;
  }
  .x-row .panel {
    background-color: #1a1428;
    background-image:
      linear-gradient(45deg, #221a36 25%, transparent 25%),
      linear-gradient(-45deg, #221a36 25%, transparent 25%);
    background-size: 10px 10px;
    border: 1px solid var(--line);
    padding: 14px;
    text-align: center;
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .x-row .panel.xhd { border-color: var(--gold); box-shadow: 0 0 14px rgba(212,160,74,0.2); }
  .x-row .panel canvas { image-rendering: pixelated; }
  .x-row .panel .lbl {
    color: var(--ink-dim);
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .x-row .panel.xhd .lbl { color: var(--gold-hi); }
</style>
</head>
<body>
<header class="masthead">
  <div class="eyebrow">PAGE · 26 · HEROES XHD · 정교화</div>
  <h1>Heroes · <span class="accent">XHD</span> · 32×32 정교 패스</h1>
  <p class="lede">
    영웅 5명을 <b>32×32 + 시그니처 무기 휴대</b>로 다시 그렸습니다 — Knight 검+방패, Mage 지팡이+오브, Warrior 거대 도끼,
    Huntress 활+화살, Cleric 향로+후광. 16×16(원본) → 24×24(HD) → <b>32×32(XHD)</b>는 캐릭터 선택 / 타이틀 화면 / 일러스트용.
    인게임에는 24×24 HD가 적당. 데이터: <code>art/heroes_xhd.js</code>.
  </p>
</header>
<main id="content"></main>

<script src="../palette.js"></script>
<script src="../sprites.js"></script>
<script src="../heroes_hd.js"></script>
<script src="../heroes_hd3.js"></script>
<script src="../heroes_smooth_walk.js"></script>
<script src="../heroes_xhd.js"></script>
<script src="../bosses_hd.js"></script>
<script src="../enemies_hd.js"></script>
<script src="../enemies_hd2.js"></script>
<script src="../weapons_hd.js"></script>
<script src="../projectiles_hd.js"></script>
<script src="../skills_hd.js"></script>
<script src="../pickups_hd2.js"></script>
<script src="../chests_polished.js"></script>
<script src="../structures.js"></script>
<script src="../structures_extra.js"></script>
<script src="../tiles_unified.js"></script>
<script src="../tiles_natural.js"></script>
<script src="../hd2_apply.js"></script>
<script src="../effects_hd3.js"></script>
<script src="../lightning_polish.js"></script>
<script src="../atlas.js"></script>
<script src="../heroes.js"></script>
<script src="../showcase.js"></script>
<script>
Showcase.renderNav('heroes_xhd');

function paint(canvas, name, scale) {
  if (!SPRITES[name]) return;
  const f = SPRITES[name][0];
  canvas.width = f[0].length * scale;
  canvas.height = f.length * scale;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(AtlasBuilder.renderFrame(name, 0), 0, 0, canvas.width, canvas.height);
}

const H = window.HEROES;
const host = document.getElementById('content');
for (const [hid, h] of Object.entries(H)) {
  const row = document.createElement('div'); row.className = 'x-row';
  row.style.setProperty('--accent', h.color);

  const info = document.createElement('div'); info.className = 'info';
  info.innerHTML = '<h3>' + h.name + '</h3>' +
    '<div class="role" style="color:' + h.color + '">' + h.role + '</div>' +
    '<div class="desc">' + h.blurb + '</div>';
  row.appendChild(info);

  // Original 16
  const p1 = document.createElement('div'); p1.className = 'panel';
  const c1 = document.createElement('canvas');
  paint(c1, h.sprite, 6);
  p1.appendChild(c1);
  p1.innerHTML += '<div class="lbl">16×16 · 6×</div>';
  Showcase.animState.push({ canvas: c1, name: h.sprite, elapsed: 0 });
  row.appendChild(p1);

  // HD 24
  const p2 = document.createElement('div'); p2.className = 'panel';
  const c2 = document.createElement('canvas');
  paint(c2, h.sprite.replace('_walk', '_hd_walk'), 4);
  p2.appendChild(c2);
  p2.innerHTML += '<div class="lbl">HD · 24×24 · 4×</div>';
  Showcase.animState.push({ canvas: c2, name: h.sprite.replace('_walk', '_hd_walk'), elapsed: 0 });
  row.appendChild(p2);

  // XHD 32
  const p3 = document.createElement('div'); p3.className = 'panel xhd';
  const c3 = document.createElement('canvas');
  const xhdName = h.sprite.replace('_walk', '_xhd_walk');
  paint(c3, xhdName, 3);
  p3.appendChild(c3);
  p3.innerHTML += '<div class="lbl">★ XHD · 32×32 · 3×</div>';
  Showcase.animState.push({ canvas: c3, name: xhdName, elapsed: 0 });
  row.appendChild(p3);

  host.appendChild(row);
}
</script>
</body>
</html>
