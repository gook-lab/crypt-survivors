<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Room Layouts · Crypt Asset Pack</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../showcase.css" />
<style>
  .chapter-section {
    background: linear-gradient(180deg, var(--panel), var(--bg-2));
    border: 1px solid var(--line);
    padding: 22px 24px;
    margin-bottom: 22px;
    position: relative;
    overflow: hidden;
  }
  .chapter-section::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(circle at 100% 0%, var(--accent), transparent 60%);
    opacity: 0.18;
    pointer-events: none;
  }
  .chapter-section h2 {
    font-family: 'Cinzel', serif;
    color: var(--ink);
    font-size: 22px;
    letter-spacing: 0.12em;
    margin: 0 0 4px;
    position: relative; z-index: 1;
  }
  .chapter-section .acc { color: var(--accent); margin-right: 10px; }
  .chapter-section .sub {
    color: var(--ink-dim);
    font-size: 11px;
    letter-spacing: 0.08em;
    margin-bottom: 18px;
    position: relative; z-index: 1;
  }

  .rooms-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 14px;
    position: relative; z-index: 1;
  }
  .room-card {
    background: var(--bg-2);
    border: 1px solid var(--line);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .room-card.boss { border-color: var(--blood); background: linear-gradient(180deg, var(--bg-2), rgba(200,51,42,0.08)); }
  .room-card.secret { border-color: var(--gold); background: linear-gradient(180deg, var(--bg-2), rgba(212,160,74,0.08)); }
  .room-card .head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  .room-card .head h3 {
    margin: 0;
    font-family: 'Cinzel', serif;
    color: var(--ink);
    font-size: 14px;
    letter-spacing: 0.04em;
  }
  .room-card.boss .head h3 { color: var(--blood); }
  .room-card.secret .head h3 { color: var(--gold-hi); }
  .room-card .head .tag {
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-dim);
    padding: 2px 6px;
    border: 1px solid var(--line);
  }
  .room-card.boss .head .tag {
    color: var(--bg);
    background: var(--blood);
    border-color: var(--blood);
  }
  .room-card.secret .head .tag {
    color: var(--bg);
    background: var(--gold);
    border-color: var(--gold);
  }
  .room-preview {
    background-color: #1a1428;
    border: 1px solid var(--line);
    overflow: hidden;
    position: relative;
  }
  .room-preview canvas {
    image-rendering: pixelated;
    display: block;
    width: 100%;
    height: auto;
  }
  .room-preview .exit-marker {
    position: absolute;
    background: var(--gold);
    width: 8px; height: 8px;
    border-radius: 50%;
    box-shadow: 0 0 6px var(--gold-hi);
  }
  .room-card .desc {
    color: var(--ink-dim);
    font-size: 11px;
    line-height: 1.5;
    min-height: 30px;
  }
  .room-card .meta {
    display: flex; gap: 8px; flex-wrap: wrap;
    font-size: 9px;
    color: var(--ink);
    letter-spacing: 0.06em;
    border-top: 1px dashed var(--line);
    padding-top: 6px;
  }
  .room-card .meta b {
    color: var(--gold-hi);
    margin-left: 4px;
  }

  /* Chapter flow diagram */
  .flow {
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 18px 20px;
    margin-top: 16px;
  }
  .flow h3 {
    color: var(--gold-hi);
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin: 0 0 12px;
  }
  .flow-row {
    display: flex; align-items: center; gap: 8px;
    flex-wrap: wrap;
    font-size: 11px;
    color: var(--ink);
  }
  .flow-node {
    background: var(--bg-2);
    border: 1px solid var(--line);
    padding: 6px 12px;
    font-family: 'Cinzel', serif;
    letter-spacing: 0.06em;
  }
  .flow-node.start { border-color: var(--cyan); color: var(--cyan); }
  .flow-node.boss { border-color: var(--blood); color: var(--blood); }
  .flow-node.secret { border-color: var(--gold); color: var(--gold-hi); }
  .flow-arrow { color: var(--gold); font-weight: 700; font-size: 16px; }
</style>
</head>
<body>

<header class="masthead">
  <div class="eyebrow">PAGE · 22 · ROOM LAYOUTS</div>
  <h1>Map <span class="accent">Room</span> Layouts · 챕터별 룸 패턴</h1>
  <p class="lede">
    각 챕터에 등장하는 룸 패턴을 한눈에. 영웅 시작 위치, 적 스폰 영역, 구조물 배치, 출구 연결까지 시각화.
    <b>일반 룸</b> · <b>보스 룸</b>(빨강) · <b>비밀 룸</b>(황금) — 비밀은 챕터당 15-25% 확률로 등장.
    데이터: <code>art/rooms.js</code>.
  </p>
</header>

<main id="content"></main>

<script src="../palette.js"></script>
<script src="../sprites.js"></script>
<script src="../structures.js"></script>
<script src="../structures_extra.js"></script>
<script src="../rooms.js"></script>
<script src="../heroes_hd.js"></script>
<script src="../heroes_hd3.js"></script>
<script src="../heroes_smooth_walk.js"></script>
<script src="../heroes_xhd.js"></script>
<script src="../bosses_hd.js"></script>
<script src="../enemies_hd.js"></script>
<script src="../enemies_hd2.js"></script>
<script src="../weapons_hd.js"></script>
<script src="../projectiles_hd.js"></script>
<script src="../skills_hd.js"></script>
<script src="../pickups_hd2.js"></script>
<script src="../chests_polished.js"></script>
<script src="../tiles_unified.js"></script>
<script src="../tiles_natural.js"></script>
<script src="../hd2_apply.js"></script>
<script src="../effects_hd3.js"></script>
<script src="../lightning_polish.js"></script>
<script src="../atlas.js"></script>
<script src="../showcase.js"></script>
<script>
Showcase.renderNav('rooms');

const CHAPTERS = [
  { id: 1, name: '망자의 묘소',  biome: 'crypt',   accent: '#8d83a0' },
  { id: 2, name: '저주받은 숲',  biome: 'forest',  accent: '#88b85a' },
  { id: 3, name: '화산 분지',    biome: 'volcano', accent: '#f08a2a' },
  { id: 4, name: '얼음 동굴',    biome: 'ice',     accent: '#6fb4dc' },
  { id: 0, name: '특수 룸',      biome: 'special', accent: '#d4a04a',
    desc: '챕터 진행 중 우연히 발견 — 보물 방이나 성소.' },
];

function renderRoom(canvas, room) {
  // Logical 480×270, display at 380×214 (~0.79× — fits card)
  const LW = 480, LH = 270;
  canvas.width = LW;
  canvas.height = LH;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  // Floor tiles
  for (let y = 0; y < 17; y++) for (let x = 0; x < 30; x++) {
    const t = room.floor[(x*7+y*13) % room.floor.length];
    if (SPRITES[t]) ctx.drawImage(AtlasBuilder.renderFrame(t, 0), x*16, y*16);
  }
  // Spawn zones overlay
  if (room.spawn_zones) {
    ctx.fillStyle = 'rgba(200, 51, 42, 0.15)';
    for (const [zx, zy, zw, zh] of room.spawn_zones) {
      ctx.fillRect(zx, zy, zw, zh);
      ctx.strokeStyle = 'rgba(200, 51, 42, 0.4)';
      ctx.strokeRect(zx + 0.5, zy + 0.5, zw - 1, zh - 1);
    }
  }
  if (room.hazards) {
    for (const h of room.hazards) {
      ctx.fillStyle = 'rgba(240, 138, 42, 0.3)';
      ctx.beginPath();
      ctx.arc(h.x, h.y, h.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  // Structures
  for (const s of room.structures || []) {
    if (!SPRITES[s.name]) continue;
    const sub = AtlasBuilder.renderFrame(s.name, 0);
    let dx = s.x - sub.width / 2;
    let dy = s.y - sub.height;
    if (s.anchor === 'center') { dy = s.y - sub.height / 2; }
    else if (s.anchor === 'top') { dy = s.y; }
    ctx.drawImage(sub, Math.round(dx), Math.round(dy));
  }
  // Boss
  if (room.boss_spawn) {
    const sub = AtlasBuilder.renderFrame(room.boss_spawn.name, 0);
    ctx.drawImage(sub, room.boss_spawn.x - sub.width/2, room.boss_spawn.y - sub.height/2);
  }
  // Player start marker
  if (room.player_start) {
    const sub = AtlasBuilder.renderFrame('knight_walk', 0);
    ctx.drawImage(sub, room.player_start.x - sub.width/2, room.player_start.y - sub.height);
    // Cyan glow under player
    ctx.fillStyle = 'rgba(73, 208, 224, 0.4)';
    ctx.beginPath();
    ctx.arc(room.player_start.x, room.player_start.y, 4, 0, Math.PI * 2);
    ctx.fill();
  }
}

const host = document.getElementById('content');
const ROOMS = window.ROOM_LAYOUTS;
const GRAPH = window.ROOM_GRAPH;

for (const ch of CHAPTERS) {
  const section = document.createElement('section');
  section.className = 'chapter-section bay';
  section.style.setProperty('--accent', ch.accent);
  const head = '<h2><span class="acc">' + (ch.id ? 'Ch.' + ch.id : 'Bonus') + '</span>' + ch.name + '</h2>' +
    '<div class="sub">' + (ch.desc || (ROOMS.filter(r => r.chapter === ch.id).length + '개 룸 패턴')) + '</div>';
  section.innerHTML = head;

  const grid = document.createElement('div'); grid.className = 'rooms-grid';

  const rooms = ROOMS.filter(r => r.chapter === ch.id);
  for (const room of rooms) {
    const card = document.createElement('div'); card.className = 'room-card';
    const isBoss = !!room.boss_spawn;
    const isSecret = ch.id === 0;
    if (isBoss) card.classList.add('boss');
    else if (isSecret) card.classList.add('secret');

    const exits = Object.entries(room.exit_points || {}).filter(([k, v]) => v).map(([k]) => k);
    const exitLabel = exits.length ? exits.join('·') : '없음 (밀폐)';

    card.innerHTML =
      '<div class="head">' +
        '<h3>' + room.name + '</h3>' +
        '<span class="tag">' + (isBoss ? 'BOSS' : (isSecret ? 'SECRET' : 'ROOM')) + '</span>' +
      '</div>' +
      '<div class="room-preview"><canvas></canvas></div>' +
      '<div class="desc">' + room.description + '</div>' +
      '<div class="meta">' +
        '<span>구조물 <b>' + (room.structures || []).length + '</b></span>' +
        '<span>스폰 존 <b>' + (room.spawn_zones || []).length + '</b></span>' +
        '<span>출구 <b>' + exitLabel + '</b></span>' +
      '</div>';
    grid.appendChild(card);

    const cvs = card.querySelector('canvas');
    renderRoom(cvs, room);
  }
  section.appendChild(grid);

  // Chapter flow diagram (for numbered chapters)
  if (ch.id > 0 && GRAPH[ch.id]) {
    const g = GRAPH[ch.id];
    const flow = document.createElement('div'); flow.className = 'flow';
    flow.innerHTML = '<h3>룸 진행 흐름</h3>';
    const row = document.createElement('div'); row.className = 'flow-row';

    const startNode = ROOMS.find(r => r.id === g.start);
    const bossNode = g.boss ? ROOMS.find(r => r.id === g.boss) : null;

    row.innerHTML =
      '<span class="flow-node start">' + (startNode ? startNode.name : g.start) + ' (시작)</span>' +
      '<span class="flow-arrow">→</span>' +
      '<span class="flow-node">랜덤 룸 × ' + (g.rooms.length - 1) + '+개</span>' +
      (g.secret_chance ? '<span class="flow-arrow">⤴</span><span class="flow-node secret">비밀 (' + Math.round(g.secret_chance * 100) + '%)</span>' : '') +
      (bossNode ? '<span class="flow-arrow">→</span><span class="flow-node boss">' + bossNode.name + '</span>' : '');
    flow.appendChild(row);
    section.appendChild(flow);
  }

  host.appendChild(section);
}
</script>
</body>
</html>
