<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Loadouts · Crypt Asset Pack</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../showcase.css" />
<style>
  .hero-loadout {
    background: linear-gradient(180deg, var(--panel), var(--bg-2));
    border: 1px solid var(--line);
    padding: 22px 22px 18px;
    margin-bottom: 22px;
    position: relative;
    overflow: hidden;
  }
  .hero-loadout::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(circle at 100% 0%, var(--accent), transparent 60%);
    opacity: 0.16;
    pointer-events: none;
  }
  .hl-head {
    display: flex; gap: 18px; align-items: center;
    margin-bottom: 18px;
    position: relative; z-index: 1;
  }
  .hl-head .portrait {
    background-color: #1a1428;
    background-image:
      linear-gradient(45deg, #221a36 25%, transparent 25%),
      linear-gradient(-45deg, #221a36 25%, transparent 25%);
    background-size: 10px 10px;
    border: 2px solid;
    padding: 8px;
  }
  .hl-head .portrait canvas { image-rendering: pixelated; }
  .hl-head .meta .name {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    color: var(--ink);
    font-size: 24px;
    letter-spacing: 0.04em;
  }
  .hl-head .meta .role {
    color: var(--gold-hi);
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    margin: 2px 0 6px;
  }
  .hl-head .meta .blurb {
    color: var(--ink-dim);
    font-size: 12px;
    line-height: 1.55;
    max-width: 560px;
  }

  /* Weapon group: 'starter' / 'exclusive' / 'pool' */
  .arsenal-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 10px;
    position: relative; z-index: 1;
  }
  .arsenal-card {
    background: var(--bg-2);
    border: 1px solid var(--line);
    padding: 12px 10px 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: center;
    text-align: center;
    position: relative;
  }
  .arsenal-card.starter { border-color: var(--gold); }
  .arsenal-card.exclusive { border-color: var(--gold); background: rgba(212,160,74,0.08); }
  .arsenal-card .badge {
    position: absolute;
    top: 4px; left: 4px;
    background: var(--gold);
    color: var(--bg);
    font-size: 8px;
    padding: 2px 6px;
    font-weight: 700;
    letter-spacing: 0.16em;
  }
  .arsenal-card .stage {
    background-color: #1a1428;
    background-image:
      linear-gradient(45deg, #221a36 25%, transparent 25%),
      linear-gradient(-45deg, #221a36 25%, transparent 25%);
    background-size: 8px 8px;
    border: 1px solid var(--line);
    padding: 6px;
    position: relative;
    overflow: hidden;
    width: 80px; height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .arsenal-card .stage .fx-bg,
  .arsenal-card .stage canvas {
    image-rendering: pixelated;
  }
  .arsenal-card .stage .fx-bg {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    opacity: 0.55;
  }
  .arsenal-card .stage .w-front {
    position: relative;
    z-index: 2;
  }
  .arsenal-card .name {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    color: var(--ink);
    font-size: 12px;
    letter-spacing: 0.04em;
  }
  .arsenal-card.exclusive .name { color: var(--gold-hi); }
  .arsenal-card .pattern {
    font-size: 9px;
    letter-spacing: 0.14em;
    color: var(--ink-dim);
    text-transform: uppercase;
  }
  .arsenal-card .blurb {
    font-size: 10px;
    color: var(--ink-dim);
    line-height: 1.5;
    min-height: 56px;
  }
  .arsenal-card .tags {
    display: flex; gap: 3px; flex-wrap: wrap; justify-content: center;
  }
  .arsenal-card .tag {
    font-size: 8px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: var(--bg);
    border: 1px solid var(--line);
    padding: 1px 4px;
    color: var(--ink);
  }
  .arsenal-card .tag[data-t="holy"]    { color: #f0d27a; border-color: rgba(212,160,74,0.5); }
  .arsenal-card .tag[data-t="fire"]    { color: #f08a2a; border-color: rgba(240,138,42,0.5); }
  .arsenal-card .tag[data-t="ice"]     { color: #6fb4dc; border-color: rgba(111,180,220,0.5); }
  .arsenal-card .tag[data-t="arcane"]  { color: #b574d8; border-color: rgba(181,116,216,0.5); }
  .arsenal-card .tag[data-t="shadow"]  { color: #8d83a0; border-color: rgba(141,131,160,0.5); }
  .arsenal-card .tag[data-t="physical"]{ color: #c0563b; border-color: rgba(192,86,59,0.5); }
  .arsenal-card .tag[data-t="lightning"]{ color: #f0d27a; border-color: rgba(212,160,74,0.5); }
  .arsenal-card .tag[data-t="nature"]  { color: #88b85a; border-color: rgba(136,184,90,0.5); }

  /* Section heading */
  .pool-section-head {
    color: var(--gold-hi);
    font-family: 'Cinzel', serif;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin: 14px 0 10px;
    padding-bottom: 6px;
    border-bottom: 1px dashed var(--line);
    position: relative; z-index: 1;
  }
  .pool-section-head small {
    color: var(--ink-dim);
    margin-left: 10px;
    font-weight: 400;
    letter-spacing: 0.04em;
    text-transform: none;
  }
</style>
</head>
<body>

<header class="masthead">
  <div class="eyebrow">PAGE · 16 · LOADOUTS</div>
  <h1>Hero <span class="accent">Loadouts</span> · 무기 풀</h1>
  <p class="lede">
    각 영웅이 어떤 무기를 잘 활용하는지 — <b>시작 무기 / 전용 무기 / 테마 풀</b>로 분류. 캐릭터별 풀에서 무기가 더 자주 등장합니다.
    영웅마다 <b>9가지 추천 무기</b> (1 시작 + 1 전용 + 3 추가 + 4 풀)로 빌드의 정체성이 명확해져요.
    데이터: <code>art/heroes.js</code> + <code>art/weapons.js</code>.
  </p>
</header>

<main id="content"></main>

<script src="../palette.js"></script>
<script src="../sprites.js"></script>
<script src="../heroes_hd.js"></script>
<script src="../heroes_hd3.js"></script>
<script src="../heroes_smooth_walk.js"></script>
<script src="../heroes_xhd.js"></script>
<script src="../bosses_hd.js"></script>
<script src="../enemies_hd.js"></script>
<script src="../enemies_hd2.js"></script>
<script src="../weapons_hd.js"></script>
<script src="../projectiles_hd.js"></script>
<script src="../skills_hd.js"></script>
<script src="../pickups_hd2.js"></script>
<script src="../chests_polished.js"></script>
<script src="../structures.js"></script>
<script src="../structures_extra.js"></script>
<script src="../tiles_unified.js"></script>
<script src="../tiles_natural.js"></script>
<script src="../hd2_apply.js"></script>
<script src="../effects_hd3.js"></script>
<script src="../lightning_polish.js"></script>
<script src="../atlas.js"></script>
<script src="../weapons.js"></script>
<script src="../heroes.js"></script>
<script src="../showcase.js"></script>
<script>
Showcase.renderNav('loadouts');

const H = window.HEROES;
const W = window.WEAPONS;
const host = document.getElementById('content');

function paint(canvas, name, size) {
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  if (SPRITES[name]) ctx.drawImage(AtlasBuilder.renderFrame(name, 0), 0, 0, size, size);
}

function weaponCard(wid, kind) {
  const w = W[wid];
  if (!w) return null;
  const card = document.createElement('div');
  card.className = 'arsenal-card ' + (kind || '');
  if (kind === 'starter' || kind === 'exclusive') {
    const b = document.createElement('div'); b.className = 'badge';
    b.textContent = kind === 'starter' ? 'STARTER' : 'EXCLUSIVE';
    card.appendChild(b);
  }
  // Stage with FX background + weapon front
  const stage = document.createElement('div'); stage.className = 'stage';
  const fxName = w.action_fx || w.cast_fx || w.aoe_fx || w.impact_fx;
  if (fxName && SPRITES[fxName]) {
    const fxC = document.createElement('canvas');
    fxC.className = 'fx-bg';
    const fr = SPRITES[fxName][0];
    const fs = Math.max(2, Math.floor(64 / Math.max(fr.length, fr[0].length)));
    fxC.width = fr[0].length * fs;
    fxC.height = fr.length * fs;
    stage.appendChild(fxC);
    // Eager paint
    const fctx = fxC.getContext('2d');
    fctx.imageSmoothingEnabled = false;
    fctx.drawImage(AtlasBuilder.renderFrame(fxName, 0), 0, 0, fxC.width, fxC.height);
    Showcase.animState.push({ canvas: fxC, name: fxName, elapsed: Math.random() });
  }
  const wC = document.createElement('canvas');
  wC.className = 'w-front';
  if (SPRITES[w.sprite]) {
    const wf = SPRITES[w.sprite][0];
    const ws = Math.max(2, Math.floor(56 / Math.max(wf.length, wf[0].length)));
    wC.width = wf[0].length * ws;
    wC.height = wf.length * ws;
    stage.appendChild(wC);
    // Eager paint so the sprite is visible even before rAF runs
    const wctx = wC.getContext('2d');
    wctx.imageSmoothingEnabled = false;
    wctx.drawImage(AtlasBuilder.renderFrame(w.sprite, 0), 0, 0, wC.width, wC.height);
    Showcase.animState.push({ canvas: wC, name: w.sprite, elapsed: 0 });
  }
  card.appendChild(stage);

  const nm = document.createElement('div'); nm.className = 'name'; nm.textContent = w.name;
  card.appendChild(nm);
  const pt = document.createElement('div'); pt.className = 'pattern'; pt.textContent = w.pattern;
  card.appendChild(pt);
  const bl = document.createElement('div'); bl.className = 'blurb';
  bl.textContent = w.blurb;
  card.appendChild(bl);
  if (w.tags && w.tags.length) {
    const tagBar = document.createElement('div'); tagBar.className = 'tags';
    for (const t of w.tags) {
      const tag = document.createElement('span'); tag.className = 'tag'; tag.dataset.t = t; tag.textContent = t;
      tagBar.appendChild(tag);
    }
    card.appendChild(tagBar);
  }
  return card;
}

function loadoutSection(title, weaponIds, kind, host) {
  if (!weaponIds.length) return;
  const head = document.createElement('div'); head.className = 'pool-section-head';
  head.innerHTML = title + ' <small>' + weaponIds.length + ' 종</small>';
  host.appendChild(head);
  const grid = document.createElement('div'); grid.className = 'arsenal-grid';
  for (const wid of weaponIds) {
    const c = weaponCard(wid, kind);
    if (c) grid.appendChild(c);
  }
  host.appendChild(grid);
}

for (const [hid, h] of Object.entries(H)) {
  const block = document.createElement('section'); block.className = 'hero-loadout';
  block.style.setProperty('--accent', h.color);

  // Head
  const head = document.createElement('div'); head.className = 'hl-head';
  const portrait = document.createElement('div'); portrait.className = 'portrait';
  portrait.style.borderColor = h.color;
  const pC = document.createElement('canvas');
  portrait.appendChild(pC);
  paint(pC, h.sprite, 80);
  Showcase.animState.push({ canvas: pC, name: h.sprite, elapsed: 0 });
  head.appendChild(portrait);
  const meta = document.createElement('div'); meta.className = 'meta';
  meta.innerHTML =
    '<div class="name">' + h.name + '</div>' +
    '<div class="role" style="color:' + h.color + '">' + h.role + '</div>' +
    '<div class="blurb">' + h.blurb + '</div>';
  head.appendChild(meta);
  block.appendChild(head);

  // Sections
  loadoutSection('시작 무기', [h.starter_weapon], 'starter', block);
  if (h.exclusive_weapon) {
    loadoutSection('전용 무기', [h.exclusive_weapon], 'exclusive', block);
  }
  // Themed (the new 3 extras — pulled by exclusive === hid && id !== exclusive_weapon)
  const themed = Object.entries(W)
    .filter(([id, w]) => w.exclusive === hid && id !== h.exclusive_weapon)
    .map(([id]) => id);
  if (themed.length) loadoutSection('테마 무기 (전용 풀)', themed, 'exclusive', block);
  // General pool minus the starter (already shown)
  const pool = h.weapon_pool.filter(id => id !== h.starter_weapon && !themed.includes(id));
  loadoutSection('일반 풀 가산', pool, '', block);

  host.appendChild(block);
}
</script>
</body>
</html>
