<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bestiary · Crypt Asset Pack</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../showcase.css" />
<style>
  .biome-section {
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 18px 20px 14px;
    margin-bottom: 18px;
    position: relative;
    overflow: hidden;
  }
  .biome-section::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(circle at 100% 0%, var(--accent), transparent 60%);
    opacity: 0.18;
    pointer-events: none;
  }
  .biome-section h2 {
    font-family: 'Cinzel', serif;
    color: var(--ink);
    font-size: 20px;
    letter-spacing: 0.14em;
    margin: 0 0 4px;
    position: relative; z-index: 1;
  }
  .biome-section .acc { color: var(--accent); font-weight: 700; margin-right: 12px; }
  .biome-section .blurb {
    color: var(--ink-dim);
    font-size: 11px;
    margin-bottom: 14px;
    position: relative; z-index: 1;
  }
  .enemy-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 10px;
    position: relative; z-index: 1;
  }
  .enemy-card {
    background: var(--bg-2);
    border: 1px solid var(--line);
    padding: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 4px;
  }
  .enemy-card.elite  { border-color: var(--gold); }
  .enemy-card.boss   { border-color: var(--blood); background: linear-gradient(180deg, rgba(200,51,42,0.1), var(--bg-2)); }
  .enemy-card .stage {
    background-color: #1a1428;
    background-image:
      linear-gradient(45deg, #221a36 25%, transparent 25%),
      linear-gradient(-45deg, #221a36 25%, transparent 25%);
    background-size: 8px 8px;
    border: 1px solid var(--line);
    padding: 8px;
    min-width: 64px; min-height: 64px;
    display: flex; align-items: center; justify-content: center;
  }
  .enemy-card .stage canvas { image-rendering: pixelated; }
  .enemy-card.boss .stage { min-width: 96px; min-height: 96px; }
  .enemy-card .nm {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    color: var(--ink);
    font-size: 12px;
    letter-spacing: 0.04em;
    margin-top: 4px;
  }
  .enemy-card.elite .nm { color: var(--gold-hi); }
  .enemy-card.boss .nm  { color: var(--blood); }
  .enemy-card .rl {
    font-size: 8px;
    color: var(--ink-dim);
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  .enemy-card .blurb {
    font-size: 9px;
    color: var(--ink-dim);
    line-height: 1.55;
    margin-top: 2px;
    min-height: 36px;
  }
  .enemy-card .stats {
    font-size: 9px;
    color: var(--gold-hi);
    letter-spacing: 0.06em;
    border-top: 1px dashed var(--line);
    padding-top: 4px;
    margin-top: 4px;
    width: 100%;
  }
  .enemy-card.boss .blurb { min-height: 0; }
  .enemy-card.boss { grid-column: span 2; }
  @media (max-width: 600px) { .enemy-card.boss { grid-column: span 1; } }
</style>
</head>
<body>
<header class="masthead">
  <div class="eyebrow">PAGE · 02 · BESTIARY</div>
  <h1>Bestiary · <span class="accent">맵별 적</span></h1>
  <p class="lede">
    4개 바이옴, 각자 고유 일반 적 4종 + 엘리트 + 보스. 일부 적은 여러 바이옴에 등장(예: 박쥐는 숲/빙굴).
    데이터: <code>art/bestiary.js</code>.
  </p>
</header>
<main id="content"></main>

<script src="../palette.js"></script>
<script src="../sprites.js"></script>
<script src="../heroes_hd.js"></script>
<script src="../heroes_hd3.js"></script>
<script src="../heroes_smooth_walk.js"></script>
<script src="../heroes_xhd.js"></script>
<script src="../bosses_hd.js"></script>
<script src="../enemies_hd.js"></script>
<script src="../enemies_hd2.js"></script>
<script src="../weapons_hd.js"></script>
<script src="../projectiles_hd.js"></script>
<script src="../skills_hd.js"></script>
<script src="../pickups_hd2.js"></script>
<script src="../chests_polished.js"></script>
<script src="../structures.js"></script>
<script src="../structures_extra.js"></script>
<script src="../tiles_unified.js"></script>
<script src="../tiles_natural.js"></script>
<script src="../hd2_apply.js"></script>
<script src="../effects_hd3.js"></script>
<script src="../lightning_polish.js"></script>
<script src="../atlas.js"></script>
<script src="../bestiary.js"></script>
<script src="../abilities.js"></script>
<script src="../showcase.js"></script>
<script>
Showcase.renderNav('bestiary');

const BIOMES = [
  { id: 'crypt',   name: '망자의 묘소',  chapter: 1, accent: '#8d83a0', blurb: '오래된 지하 묘소. 잠들지 못한 망자들의 무리.' },
  { id: 'forest',  name: '저주받은 숲',  chapter: 2, accent: '#88b85a', blurb: '안개와 그림자가 짙은 고대 숲. 살아 움직이는 식물들.' },
  { id: 'volcano', name: '화산 분지',    chapter: 3, accent: '#f08a2a', blurb: '용암이 흐르는 지옥의 입구. 불의 정령과 악마.' },
  { id: 'ice',     name: '얼음 동굴',    chapter: 4, accent: '#6fb4dc', blurb: '영원히 얼어붙은 동굴. 결정과 한기를 두른 존재들.' },
];

const B = window.BESTIARY;
const P = window.BIOME_POOLS;
const host = document.getElementById('content');

function paint(canvas, name, size) {
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  if (SPRITES[name]) ctx.drawImage(AtlasBuilder.renderFrame(name, 0), 0, 0, size, size);
}

function card(eid, kind) {
  const e = B[eid];
  if (!e) return null;
  const c = document.createElement('div');
  c.className = 'enemy-card ' + (e.role === 'elite' ? 'elite' : (e.role === 'boss' ? 'boss' : ''));
  const stage = document.createElement('div'); stage.className = 'stage';
  const can = document.createElement('canvas');
  stage.appendChild(can);
  const size = e.role === 'boss' ? 96 : (e.role === 'elite' ? 80 : 64);
  paint(can, eid, size);
  c.appendChild(stage);
  // Build remaining markup as a sibling fragment so the canvas reference stays live
  const rest = document.createElement('div');
  rest.style.cssText = 'display:contents';
  rest.innerHTML = '<div class="nm">' + e.name + '</div>' +
    '<div class="rl">' + e.role + '</div>' +
    '<div class="blurb">' + e.blurb + '</div>' +
    (window.ABILITIES && window.ABILITIES[eid] ?
      (e.role === 'boss'
        ? '<div class="stats" style="text-align:left;font-size:8px;line-height:1.55"><b style="color:var(--blood)">스킬 ' + window.ABILITIES[eid].phases + ' 페이즈:</b><br>' +
            window.ABILITIES[eid].abilities.map(a => '• <b style="color:var(--ink)">' + a.name + '</b> — ' + a.notes).join('<br>') +
          '</div>'
        : '<div class="stats" style="text-align:left;font-size:8px;line-height:1.55"><b>' + window.ABILITIES[eid].name + '</b><br>' + window.ABILITIES[eid].notes + '</div>')
      : '') +
    '<div class="stats">HP ' + e.hp + ' · SPD ' + e.spd + '</div>';
  c.appendChild(rest);
  // Now that the canvas is still in the DOM, register for animation
  Showcase.animState.push({ canvas: can, name: eid, elapsed: 0 });
  return c;
}

for (const bio of BIOMES) {
  const section = document.createElement('section'); section.className = 'biome-section';
  section.style.setProperty('--accent', bio.accent);
  section.innerHTML = '<h2><span class="acc">Ch.' + bio.chapter + '</span>' + bio.name + '</h2>' +
    '<div class="blurb">' + bio.blurb + '</div>';
  const grid = document.createElement('div'); grid.className = 'enemy-grid';
  const pool = P[bio.id];
  const all = [...pool.basic, ...pool.elite, ...pool.bosses];
  for (const eid of all) {
    const c = card(eid);
    if (c) grid.appendChild(c);
  }
  section.appendChild(grid);
  host.appendChild(section);
}
</script>
</body>
</html>
