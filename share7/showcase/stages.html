<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stages · Crypt Asset Pack</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../showcase.css" />
<style>
  .stage-stage {
    background: #07060c;
    border: 1px solid var(--line);
    padding: 14px;
  }
  .stage-frame { padding: 24px 24px 20px; }
  .stage-head h2 {
    font-family: 'Cinzel', serif;
    color: var(--gold-hi);
    font-size: 24px;
    letter-spacing: 0.18em;
    margin: 0 0 12px;
    text-align: center;
  }
  .stages {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }
  .stage-card {
    background: var(--panel);
    border: 1px solid var(--line);
    cursor: pointer;
    overflow: hidden;
    transition: transform 0.1s, border-color 0.15s;
    position: relative;
  }
  .stage-card:hover { transform: translateY(-3px); border-color: var(--accent); }
  .stage-card.locked {
    opacity: 0.55;
    cursor: not-allowed;
  }
  .stage-card.locked::before {
    content: '🔒';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 48px;
    z-index: 2;
    color: var(--ink);
    filter: drop-shadow(0 0 8px black);
  }
  .stage-card .preview {
    background-color: #1a1428;
    height: 140px;
    overflow: hidden;
    position: relative;
    border-bottom: 1px solid var(--line);
  }
  .stage-card .preview canvas {
    image-rendering: pixelated;
    width: 100%;
    height: 100%;
  }
  .stage-card .chapter-tag {
    position: absolute;
    top: 6px;
    left: 6px;
    background: rgba(7,6,12,0.85);
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 0.18em;
    padding: 3px 8px;
    z-index: 1;
  }
  .stage-card .body {
    padding: 12px 14px;
  }
  .stage-card .name {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    color: var(--ink);
    font-size: 15px;
    letter-spacing: 0.06em;
    margin-bottom: 4px;
  }
  .stage-card .blurb {
    color: var(--ink-dim);
    font-size: 10px;
    line-height: 1.5;
    margin-bottom: 10px;
    min-height: 30px;
  }
  .stage-card .boss-row {
    display: flex; align-items: center; gap: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--line);
  }
  .stage-card .boss-row canvas { image-rendering: pixelated; width: 28px; height: 28px; }
  .stage-card .boss-row .b {
    color: var(--blood);
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  .stage-card .boss-row .bn { color: var(--ink); font-size: 12px; font-weight: 500; }
  .stage-card .meta-row {
    display: flex; gap: 8px;
    margin-top: 8px;
    font-size: 10px;
    color: var(--ink-dim);
    letter-spacing: 0.06em;
  }
  .stage-card .meta-row b { color: var(--ink); }
  .stage-card .rewards {
    font-size: 10px;
    color: var(--gold-hi);
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--line);
  }
  .stage-card .enemy-strip {
    display: flex; gap: 4px;
    padding: 8px 14px 0;
  }
  .stage-card .enemy-strip canvas {
    image-rendering: pixelated;
    width: 22px; height: 22px;
    background: rgba(7,6,12,0.4);
    padding: 2px;
  }
</style>
</head>
<body>
<header class="masthead">
  <div class="eyebrow">PAGE · 13 · STAGE SELECT</div>
  <h1>Chapter · <span class="accent">Stage</span> Select</h1>
  <p class="lede">
    4개 챕터, 각자 고유 바이옴 · 적 · 보스. 챕터를 클리어할수록 다음이 해금됩니다.
    데이터: <code>art/stages.js</code>.
  </p>
</header>
<main>

<section class="bay">
  <h2>01 · Stage Select UI</h2>
  <p class="bay-sub">메뉴 → "플레이" 진입 시 보일 화면. 카드 클릭 시 캐릭터 선택으로 이동.</p>
  <div class="stage-stage">
    <div class="stage-frame">
      <div class="stage-head">
        <h2>CHAPTER SELECT</h2>
      </div>
      <div class="stages" id="stages"></div>
    </div>
  </div>
</section>

</main>

<script src="../palette.js"></script>
<script src="../sprites.js"></script>
<script src="../heroes_hd.js"></script>
<script src="../heroes_hd3.js"></script>
<script src="../heroes_smooth_walk.js"></script>
<script src="../heroes_xhd.js"></script>
<script src="../bosses_hd.js"></script>
<script src="../enemies_hd.js"></script>
<script src="../enemies_hd2.js"></script>
<script src="../weapons_hd.js"></script>
<script src="../projectiles_hd.js"></script>
<script src="../skills_hd.js"></script>
<script src="../pickups_hd2.js"></script>
<script src="../chests_polished.js"></script>
<script src="../structures.js"></script>
<script src="../structures_extra.js"></script>
<script src="../tiles_unified.js"></script>
<script src="../tiles_natural.js"></script>
<script src="../hd2_apply.js"></script>
<script src="../effects_hd3.js"></script>
<script src="../lightning_polish.js"></script>
<script src="../atlas.js"></script>
<script src="../stages.js"></script>
<script src="../showcase.js"></script>
<script>
Showcase.renderNav('stages');

const S = window.STAGES;
const host = document.getElementById('stages');

S.forEach((st, idx) => {
  const card = document.createElement('div');
  card.className = 'stage-card' + (idx >= 2 ? ' locked' : '');
  card.style.setProperty('--accent', st.accent);

  // Preview: tiled biome
  const prev = document.createElement('div'); prev.className = 'preview';
  const c = document.createElement('canvas');
  prev.appendChild(c);
  c.width = 240; c.height = 140;
  const ctx = c.getContext('2d'); ctx.imageSmoothingEnabled = false;
  // tile floor
  for (let y = 0; y < 9; y++) for (let x = 0; x < 15; x++) {
    const t = st.tile_pool[(x*7 + y*3) % st.tile_pool.length];
    ctx.drawImage(AtlasBuilder.renderFrame(t, 0), x * 16, y * 16);
  }
  // sprinkle a few enemies
  const enemiesPlace = [
    { name: st.enemies[0], x: 50, y: 50 },
    { name: st.enemies[Math.min(1, st.enemies.length - 1)], x: 160, y: 80 },
    { name: st.elite[0], x: 110, y: 30 },
    { name: st.boss, x: 200, y: 50 },
  ];
  for (const e of enemiesPlace) {
    if (!SPRITES[e.name]) continue;
    const f = AtlasBuilder.renderFrame(e.name, 0);
    ctx.drawImage(f, e.x - f.width / 2, e.y - f.height / 2);
  }

  // chapter tag
  const ct = document.createElement('div'); ct.className = 'chapter-tag';
  ct.style.borderColor = st.accent;
  ct.style.color = st.accent;
  ct.textContent = 'CHAPTER ' + st.chapter;
  prev.appendChild(ct);
  card.appendChild(prev);

  // enemy strip
  const strip = document.createElement('div'); strip.className = 'enemy-strip';
  for (const eid of [...st.enemies, ...st.elite].slice(0, 4)) {
    if (!SPRITES[eid]) continue;
    const cc = document.createElement('canvas');
    cc.width = 22; cc.height = 22;
    const cctx = cc.getContext('2d');
    cctx.imageSmoothingEnabled = false;
    cctx.drawImage(AtlasBuilder.renderFrame(eid, 0), 0, 0, cc.width, cc.height);
    strip.appendChild(cc);
  }
  card.appendChild(strip);

  // body
  const body = document.createElement('div'); body.className = 'body';
  body.innerHTML =
    '<div class="name">' + st.name + '</div>' +
    '<div class="blurb">' + st.blurb + '</div>' +
    '<div class="meta-row">' +
      '<span>지속 <b>' + st.duration + '분</b></span>' +
      '<span>· 적 <b>' + st.enemies.length + '+' + st.elite.length + '종</b></span>' +
    '</div>';
  // boss row
  const bossRow = document.createElement('div'); bossRow.className = 'boss-row';
  const bc = document.createElement('canvas');
  bossRow.appendChild(bc);
  bc.width = 28; bc.height = 28;
  const bctx = bc.getContext('2d');
  bctx.imageSmoothingEnabled = false;
  if (SPRITES[st.boss]) bctx.drawImage(AtlasBuilder.renderFrame(st.boss, 0), 0, 0, 28, 28);
  bossRow.innerHTML += '<div><span class="b">BOSS</span><br><span class="bn">' + st.boss_name + '</span></div>';
  body.appendChild(bossRow);
  const rew = document.createElement('div'); rew.className = 'rewards';
  rew.textContent = '🎁 ' + st.rewards.join(' · ');
  body.appendChild(rew);
  card.appendChild(body);
  host.appendChild(card);
});
</script>
</body>
</html>
